services:
  mysql:
    image: mysql:8.4
    container_name: dental_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: dental_platform
      MYSQL_USER: dental
      MYSQL_PASSWORD: dentalpass
    ports:
     - "3307:3306"
    volumes:
      - ./docker/mysql-data:/var/lib/mysql
      # - ./packages/shared/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10